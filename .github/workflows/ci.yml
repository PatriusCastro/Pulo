# Runs on every pull request (and on main after a merge). The "check" job is required by
# the main branch ruleset, so a PR can't merge until it passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest # the Rust side uses Windows APIs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-pulo

      - run: npm ci
      - run: npm run build # type-check and bundle the UI (Rust's build needs dist/)
      - run: npm run check
      - run: cargo test --manifest-path src-pulo/Cargo.toml
